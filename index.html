<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><title>Comenzi</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f3b73">
<link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7280;--ac:#1f3b73;--bd:#d8dee3}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1c232c;--tx:#e8ecf1;--mu:#98a2b0;--ac:#7fa4f0;--bd:#2d3744}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 80px}
input,button,select{font:inherit;color:var(--tx)}
.top{position:sticky;top:0;background:var(--bg);padding:10px 12px;z-index:5}
.in{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.bar{display:flex;gap:8px;margin-top:8px}.bar>*{flex:1}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:11px;font-weight:600}
.btn.s{background:var(--card);color:var(--ac);border:1px solid var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 12px;padding:10px 12px}
.row{display:flex;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:13px}
.b{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd);white-space:nowrap}
.det{display:none;margin-top:8px;border-top:1px solid var(--bd);padding-top:6px;font-size:13px}.open .det{display:block}
.det div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.det span:first-child{color:var(--mu)}.det span:last-child{text-align:right}
.p{padding:12px}.hide{display:none}
.ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px;z-index:30}.ov.hide{display:none}
.sc{color:#1f8a55;font-weight:700}
.chip{display:inline-block;padding:6px 12px;margin:6px 6px 0 0;border-radius:16px;border:1px solid var(--ac);color:var(--ac);background:var(--card)}
.chip.on{background:var(--ac);color:var(--bg)}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}.cnav .btn{flex:0 0 52px}.cnav b{flex:1;text-align:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{text-align:center;color:var(--mu);font-size:12px;padding:2px 0}
.cd{min-height:54px;border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:3px 4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.cd b{font-size:12px;font-weight:600}.cd.today b{color:var(--ac);text-decoration:underline}.cd.sel{outline:2px solid var(--ac)}
.dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}.dt{width:9px;height:9px;border-radius:50%;display:inline-block}.dots em{font-size:10px;color:var(--mu);font-style:normal}
.chip.off{opacity:.5}.ff{margin-top:2px}
#arbox{position:relative;margin-top:10px;background:#000;border-radius:12px;overflow:hidden;min-height:180px}
#arbox video,#arf{width:100%;height:auto;display:block}#arf{display:none}
#arc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}#arcards{position:absolute;inset:0;pointer-events:none}
.arcard{position:absolute;max-width:82%;min-width:210px;background:rgba(10,20,40,.88);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 10px;font-size:13px;pointer-events:auto;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.arcard .ah{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.arcard .al{display:flex;justify-content:space-between;gap:10px;padding:1px 0}.arcard .al span{opacity:.7}.arcard .al b{text-align:right}.mu2{font-size:12px;opacity:.75}
</style></head><body>
<div class="top">
 <div class="bar"><button class="btn s" id="xl">📂 Încarcă Excel</button><button class="btn s" id="st">⚙️ Setări</button></div>
 <div class="bar"><button class="btn" id="t1">📋 Comenzi</button><button class="btn s" id="t2">📅 Calendar</button><button class="btn s" id="t3">📷 AR</button></div>
 <div id="s1">
  <input class="in" id="q" type="search" placeholder="Caută: nr. comandă (ext., int., lingou, forjă), client, aliaj..." style="margin-top:8px">
  <div class="bar"><input class="in" id="dz" type="date" title="Zi"><button class="btn s" id="dc" style="flex:0 0 52px">✕</button></div>
 </div>
 <input type="file" id="fx" accept=".xlsx,.xls,.xlsm,.csv" hidden>
</div>
<div id="lk" class="ov hide"><h2>🔒 Comenzi</h2><input class="in" id="lp" type="password" placeholder="Parola" autocomplete="current-password"><button class="btn" id="lg">Deblochează</button><div id="le" class="mu"></div></div>
<div id="v1"><div class="p mu" id="info"></div><div id="list"></div></div>
<div id="v2" class="hide"><div id="cal"></div></div>
<div id="v3" class="hide"><div class="p">
 <div class="bar"><button class="btn" id="m1">🎥 Live</button><button class="btn s" id="m2">📸 Poză</button></div>
 <div id="arbox"><video id="arv" playsinline muted autoplay></video><canvas id="arf"></canvas><canvas id="arc"></canvas><div id="arcards"></div></div>
 <p class="mu" id="arst">Îndreaptă camera spre marcajul lingoului.</p>
 <div class="bar"><button class="btn hide" id="arshot">📸 Fă poza</button><button class="btn s" id="arfile">🖼️ Din galerie</button><button class="btn s" id="arsave">💾 Salvează</button></div>
 <form id="arman" class="bar"><input class="in" id="armt" placeholder="Nu citește? Scrie marcajul (ex. 7H342)" autocomplete="off"><button class="btn" style="flex:0 0 80px">Caută</button></form>
 <input type="file" id="arfi" accept="image/*" hidden>
</div></div>
<script src="gate.js"></script><script src="xlsx.full.min.js"></script><script src="parser.js"></script><script src="ar-core.js"></script><script src="app.js"></script><script src="ar.js"></script>
</body></html>
